<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      background: #f5f5f5;
    }
    .container {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      margin: 0 0 15px 0;
      font-size: 18px;
      color: #333;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ccc;
    }
    .status-dot.active {
      background: #4CAF50;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .status-text {
      font-size: 14px;
      color: #666;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #007AFF;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0051D5;
    }
    button.off {
      background: #999;
    }
    button.off:hover {
      background: #777;
    }
    .info {
      margin-top: 15px;
      padding: 10px;
      background: #f0f7ff;
      border-left: 3px solid #007AFF;
      font-size: 12px;
      color: #555;
      line-height: 1.4;
    }
    .location {
      text-align: center;
      margin-top: 15px;
      padding: 10px;
      background: #e8f5e9;
      border-radius: 4px;
      font-size: 13px;
      color: #2e7d32;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🇦🇷 Argentina IP</h1>
    
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Desactivado</span>
    </div>

    <button id="toggleBtn">Activar Emulación</button>

    <div class="location">
      📍 Buenos Aires, Argentina
    </div>

    <div class="info">
      ✓ Simula IP argentina<br>
      ✓ Modifica User-Agent<br>
      ✓ Establece idioma es-AR<br>
      ✓ Compatible con sitios geobloqueados
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
